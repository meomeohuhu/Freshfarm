services:
  - type: web
    name: freshfarm-web-platform
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: freshfarm-db
          property: connectionString

databases:
  - name: freshfarm-db
    databaseName: freshfarm_db
    user: postgres
    plan: free
